name: CI

# Run on pushes and pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the Dockerfile base (3.10) plus one newer interpreter.
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # A lean install: the current tests exercise config loading and device
        # detection, so we install only pyyaml, a CPU-only torch, and pytest.
        # Full training dependencies are installed from requirements.txt for
        # training runs, not for this fast unit-test gate.
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest tests/ -v
